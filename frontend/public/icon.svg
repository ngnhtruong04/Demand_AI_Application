<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="demandGradient" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background squircle container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#demandGradient)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" stroke="rgba(255, 255, 255, 0.22)" stroke-width="4"/>

  <!-- Glowing halo behind main star -->
  <circle cx="384" cy="128" r="64" fill="#7dd3fc" opacity="0.32" filter="url(#softGlow)"/>

  <!-- 3 Ascending Demand Volume Bars -->
  <!-- Bar 1 (t-2) -->
  <rect x="103" y="304" width="50" height="112" rx="25" fill="#ffffff" fill-opacity="0.55"/>
  <!-- Bar 2 (t-1) -->
  <rect x="187" y="224" width="50" height="192" rx="25" fill="#ffffff" fill-opacity="0.78"/>
  <!-- Bar 3 (t0) -->
  <rect x="271" y="144" width="50" height="272" rx="25" fill="#ffffff" fill-opacity="1.00"/>

  <!-- Forecasting Trend Line Outer Glow & Core -->
  <line x1="128" y1="329" x2="384" y2="128" stroke="#0ea5e9" stroke-width="18" stroke-linecap="round" opacity="0.45"/>
  <line x1="128" y1="329" x2="384" y2="128" stroke="#bae6fd" stroke-width="10" stroke-linecap="round"/>

  <!-- Tracking Nodes on Historical Bars -->
  <!-- Node 1 -->
  <circle cx="128" cy="329" r="14" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <circle cx="128" cy="329" r="6" fill="#0ea5e9"/>
  <!-- Node 2 -->
  <circle cx="212" cy="249" r="14" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <circle cx="212" cy="249" r="6" fill="#0ea5e9"/>
  <!-- Node 3 -->
  <circle cx="296" cy="169" r="14" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <circle cx="296" cy="169" r="6" fill="#0ea5e9"/>

  <!-- AI Prediction Horizon Star (Apex) -->
  <polygon points="384,70 398,114 442,128 398,142 384,186 370,142 326,128 370,114" fill="#ffffff"/>
  <circle cx="384" cy="128" r="8" fill="#fef08a"/>

  <!-- Secondary Satellite AI Sparkle -->
  <polygon points="416,198 422,214 438,220 422,226 416,242 410,226 394,220 410,214" fill="#ffffff" opacity="0.85"/>
</svg>
